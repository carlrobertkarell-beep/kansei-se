name: Apply Kansei v125

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v125.yml'

permissions:
  contents: write

jobs:
  apply-v125:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v125
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYV125'
          from pathlib import Path
          import re
          ROOT=Path('.')
          
          def replace_contains(rel, marker, new_line):
              p=ROOT/rel
              original=p.read_text(encoding='utf-8')
              had_nl=original.endswith('\n')
              lines=original.splitlines()
              hits=[i for i,l in enumerate(lines) if marker in l]
              if len(hits)!=1:
                  raise RuntimeError(f"{rel}: expected one line containing {marker!r}, got {len(hits)}")
              lines[hits[0]]=new_line
              p.write_text('\n'.join(lines)+('\n' if had_nl else ''), encoding='utf-8')
          
          # Global v125 cleanup.
          for p in ROOT.rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('<noscript><noscript>', '<noscript>').replace('</noscript></noscript>', '</noscript>')
              s=s.replace('omdömen · Legitimerad vård', 'omdömen på Bokadirekt · Legitimerad vård')
              s=re.sub(r'^<meta name="keywords"[^>]*>\n?', '', s, flags=re.M)
              p.write_text(s, encoding='utf-8')
          
          replace_contains('index.html', '<meta name="description" content=', '<meta name="description" content="Naprapati, muskuloskeletalt ultraljud, PRP, hyaluronsyra och medicinsk akupunktur vid Odenplan i Vasastan, Stockholm. Diagnos och behandling vid samma besök.">')
          replace_contains('index.html', '<meta property="og:description" content=', '<meta property="og:description" content="Naprapati, muskuloskeletalt ultraljud, PRP, hyaluronsyra och medicinsk akupunktur vid Odenplan i Vasastan, Stockholm. Diagnos och behandling vid samma besök.">')
          replace_contains('index.html', '"@type": "MedicalClinic", "name": "Kansei Rehabcenter"', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"MedicalClinic","@id":"https://www.kansei.se/#clinic","name":"Kansei Rehabcenter","url":"https://www.kansei.se/","inLanguage":"sv","description":"Medicinsk klinik vid Odenplan i Vasastan med legitimerad naprapat, muskuloskeletalt ultraljud, rehabilitering och ultraljudsvägledda injektionsbehandlingar.","areaServed":[{"@type":"City","name":"Stockholm"},{"@type":"Place","name":"Vasastan, Stockholm"},{"@type":"Place","name":"Odenplan, Stockholm"}],"hasMap":"https://maps.google.com/?q=Upplandsgatan+26,+Stockholm","email":"info@kansei.se","telephone":"+46 73 398 85 88","priceRange":"890-3490 SEK","image":"https://www.kansei.se/og.png","logo":"https://www.kansei.se/apple-touch-icon.png","address":{"@type":"PostalAddress","streetAddress":"Upplandsgatan 26","postalCode":"113 60","addressLocality":"Stockholm","addressRegion":"Stockholms län","addressCountry":"SE"},"geo":{"@type":"GeoCoordinates","latitude":59.3397,"longitude":18.0517},"sameAs":["https://www.instagram.com/kansei.se","https://www.bokadirekt.se/places/kansei-rehabcenter-48847"],"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":["Monday","Tuesday","Wednesday","Thursday","Friday"],"opens":"08:00","closes":"19:00"},{"@type":"OpeningHoursSpecification","dayOfWeek":["Saturday","Sunday"],"opens":"10:00","closes":"15:00"}],"knowsAbout":["Naprapati","Muskuloskeletalt ultraljud","Rehabilitering","PRP / ACP","Hyaluronsyra","Medicinsk akupunktur","Idrottsmedicin"],"founder":{"@type":"Person","@id":"https://www.kansei.se/team/carl-robert-karell/#person","name":"Carl-Robert Kårell","jobTitle":"Leg. naprapat","url":"https://www.kansei.se/team/carl-robert-karell/","worksFor":{"@id":"https://www.kansei.se/#clinic"}},"availableService":[{"@type":"MedicalTherapy","name":"Naprapatbehandling","url":"https://www.kansei.se/naprapati/"},{"@type":"MedicalTest","name":"Muskuloskeletalt ultraljud","url":"https://www.kansei.se/ultraljud/"},{"@type":"MedicalTherapy","name":"PRP / ACP-behandling","url":"https://www.kansei.se/prp/"},{"@type":"MedicalTherapy","name":"Hyaluronsyrainjektion","url":"https://www.kansei.se/hyaluronsyra/"},{"@type":"MedicalTherapy","name":"Medicinsk akupunktur","url":"https://www.kansei.se/akupunktur/"},{"@type":"MedicalTherapy","name":"Rehabilitering","url":"https://www.kansei.se/rehabilitering/"}],"employee":[{"@type":"Person","@id":"https://www.kansei.se/team/magnus-wennerlund/#person","name":"Magnus Wennerlund","jobTitle":"Leg. fysioterapeut","url":"https://www.kansei.se/team/magnus-wennerlund/","knowsAbout":["Ultraljudsdiagnostik av axelleden","Ortopedisk rehabilitering"]},{"@type":"Person","@id":"https://www.kansei.se/team/thomas-eriksson/#person","name":"Thomas Eriksson","jobTitle":"Specialist i ortopedi","url":"https://www.kansei.se/team/thomas-eriksson/","knowsAbout":["Artroskopisk kirurgi","Idrottsskador"]}]}</script>')
          replace_contains('index.html', '<div class="kicker">Odenplan · Stockholm</div>', '    <div class="kicker">Odenplan · Vasastan · Stockholm</div>')
          replace_contains('index.html', 'class="hero-omd" href="#omdomen"', '    <a class="hero-omd" href="#omdomen" aria-label="Läs omdömen"><span class="hero-omd-stj">★★★★★</span><span><b><span data-omd-betyg>4,8</span></b> av 5 · <span data-omd-antal>301</span> omdömen på Bokadirekt</span></a>')
          replace_contains('index.html', 'data-k="snitt"', '    <p class="assure reveal"><span data-omd-betyg>4,8</span> ★ av <span data-omd-antal>301</span> verifierade patientomdömen på Bokadirekt</p>')
          replace_contains('naprapati/index.html', '<title>Naprapat Stockholm:', '<title>Naprapat Odenplan & Vasastan | Kansei Rehabcenter</title>')
          replace_contains('naprapati/index.html', '<meta name="description" content=', '<meta name="description" content="Legitimerad naprapat på Upplandsgatan 26 vid Odenplan i Vasastan, Stockholm. Undersökning, behandling och rehab för rygg, nacke, axel, höft och knä. Boka utan remiss.">')
          replace_contains('naprapati/index.html', '<meta property="og:title" content=', '<meta property="og:title" content="Naprapat Odenplan & Vasastan | Kansei Rehabcenter"><meta property="og:description" content="Legitimerad naprapat på Upplandsgatan 26 vid Odenplan i Vasastan, Stockholm. Undersökning, behandling och rehab för rygg, nacke, axel, höft och knä. Boka utan remiss.">')
          replace_contains('naprapati/index.html', '"@type": "MedicalWebPage", "name": "Naprapat Stockholm', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"MedicalWebPage","@id":"https://www.kansei.se/naprapati/#webpage","name":"Naprapat vid Odenplan i Vasastan | Kansei Rehabcenter","url":"https://www.kansei.se/naprapati/","inLanguage":"sv","about":{"@type":"MedicalTherapy","name":"Naprapati"},"provider":{"@id":"https://www.kansei.se/#clinic"},"mainEntity":{"@type":"MedicalTherapy","name":"Naprapatbehandling","provider":{"@id":"https://www.kansei.se/#clinic"},"areaServed":[{"@type":"Place","name":"Odenplan, Stockholm"},{"@type":"Place","name":"Vasastan, Stockholm"},{"@type":"City","name":"Stockholm"}],"offers":{"@type":"Offer","price":"890","priceCurrency":"SEK","url":"https://www.bokadirekt.se/boka-tjanst/kansei-rehabcenter-48847/naprapati-ny-resp-aterbesok-3263299","availability":"https://schema.org/InStock"}}}</script><script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Hem", "item": "https://www.kansei.se/"}, {"@type": "ListItem", "position": 2, "name": "Naprapat vid Odenplan i Vasastan", "item": "https://www.kansei.se/naprapati/"}]}</script><script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Behöver jag remiss?", "acceptedAnswer": {"@type": "Answer", "text": "Nej. Naprapater är legitimerad vårdpersonal och du bokar direkt utan remiss."}}, {"@type": "Question", "name": "Gör behandlingen ont?", "acceptedAnswer": {"@type": "Answer", "text": "Viss behandling, som triggerpunktsbehandling, kan kännas tydligt i stunden, men vi anpassar alltid intensiteten efter dig. Träningsvärkskänsla en till två dagar efteråt är normalt."}}, {"@type": "Question", "name": "Hur många behandlingar behövs?", "acceptedAnswer": {"@type": "Answer", "text": "Många akuta besvär förbättras påtagligt inom en till tre behandlingar. Långvariga besvär kräver ofta en längre plan med rehabilitering — du får en ärlig prognos vid första besöket."}}, {"@type": "Question", "name": "Kan jag använda friskvårdsbidrag?", "acceptedAnswer": {"@type": "Answer", "text": "Friskvårdsbehandling och massage är godkända för friskvårdsbidrag hos de flesta arbetsgivare. Sjukvårdande naprapatbehandling omfattas normalt inte."}}, {"@type": "Question", "name": "Vad är skillnaden mellan naprapat, kiropraktor och fysioterapeut?", "acceptedAnswer": {"@type": "Answer", "text": "Alla tre är legitimerade yrken. Naprapati kombinerar ledbehandling med omfattande mjukdelsbehandling och rehabilitering — en bred manuell verktygslåda för hela rörelseapparaten."}}, {"@type": "Question", "name": "Måste det knaka?", "acceptedAnswer": {"@type": "Answer", "text": "Nej. Knäppande ljud vid ledbehandling är ofarligt men inget mål i sig — mobilisering utan ljud fungerar lika bra, och vi väljer teknik tillsammans med dig."}}, {"@type": "Question", "name": "Kan jag komma som gravid?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Behandlingen anpassas i teknik och läge, och rygg- och bäckenbesvär under graviditet är bland det vanligaste vi hjälper till med."}}, {"@type": "Question", "name": "Vad ska jag ha på mig?", "acceptedAnswer": {"@type": "Answer", "text": "Vanliga, rörliga kläder räcker. Behöver vi komma åt ett område får du låna shorts eller linne — du behöver inte förbereda något."}}, {"@type": "Question", "name": "Behandlar ni barn och äldre?", "acceptedAnswer": {"@type": "Answer", "text": "Ja, med tekniker och dosering anpassade efter ålder. För barn med idrottsrelaterade besvär är bedömningen extra viktig, eftersom växande vävnad har egna diagnoser som ska fångas rätt."}}]}</script>')
          replace_contains('naprapati/index.html', '/ Naprapati i Stockholm</div>', '<div class="crumb"><a href="/">Hem</a> / Naprapat vid Odenplan i Vasastan</div>')
          replace_contains('naprapati/index.html', '<h1>Naprapati i Stockholm</h1>', '<h1>Naprapat vid Odenplan i Vasastan</h1>')
          replace_contains('naprapati/index.html', '<p class="intro">Naprapati är legitimerad vård', '<p class="intro">Söker du naprapat vid Odenplan eller i Vasastan? På Kansei Rehabcenter, Upplandsgatan 26 i Stockholm, får du undersökning, behandling och rehabilitering hos legitimerad naprapat. Vi bedömer leder, muskler, senor och nervsystem som en helhet och anpassar behandlingen efter dina besvär och mål.</p>')
          replace_contains('kontakt/index.html', '"@type": "MedicalWebPage", "name": "Patientinformation — trygg vård', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"ContactPage","@id":"https://www.kansei.se/kontakt/#webpage","name":"Kontakt | Kansei Rehabcenter","url":"https://www.kansei.se/kontakt/","inLanguage":"sv","mainEntity":{"@type":"MedicalClinic","@id":"https://www.kansei.se/#clinic","name":"Kansei Rehabcenter","url":"https://www.kansei.se/","telephone":"+46 73 398 85 88","email":"info@kansei.se","address":{"@type":"PostalAddress","streetAddress":"Upplandsgatan 26","postalCode":"113 60","addressLocality":"Stockholm","addressRegion":"Stockholms län","addressCountry":"SE"},"geo":{"@type":"GeoCoordinates","latitude":59.3397,"longitude":18.0517}}}</script><script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Hem", "item": "https://www.kansei.se/"}, {"@type": "ListItem", "position": 2, "name": "Kontakt", "item": "https://www.kansei.se/kontakt/"}]}</script><script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Hur begär jag ut min journal?", "acceptedAnswer": {"@type": "Answer", "text": "Mejla info@kansei.se så får du en kopia. Rätten att ta del av din egen journal är lagstadgad."}}, {"@type": "Question", "name": "Omfattas jag av patientförsäkring?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Verksamheten omfattas av patientförsäkring enligt patientskadelagen, precis som övrig hälso- och sjukvård."}}, {"@type": "Question", "name": "Vad tar ni betalt vid sen avbokning?", "acceptedAnswer": {"@type": "Answer", "text": "Av- och omboka via din bokningsbekräftelse från Bokadirekt. Vid sen avbokning eller uteblivet besök kan besöket debiteras — omboka hellre än att utebli."}}]}</script>')
          replace_contains('team/carl-robert-karell/index.html', '"@type": "MedicalWebPage", "name": "Carl-Robert Kårell', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"MedicalWebPage","name":"Carl-Robert Kårell — leg. naprapat | Kansei Rehabcenter","url":"https://www.kansei.se/team/carl-robert-karell/","inLanguage":"sv","provider":{"@id":"https://www.kansei.se/#clinic"}}</script><script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Hem", "item": "https://www.kansei.se/"}, {"@type": "ListItem", "position": 2, "name": "Carl-Robert Kårell", "item": "https://www.kansei.se/team/carl-robert-karell/"}]}</script><style>')
          replace_contains('team/carl-robert-karell/index.html', '"@type": "ProfilePage", "mainEntity"', '<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfilePage","mainEntity":{"@type":"Person","name":"Carl-Robert Kårell","jobTitle":"Leg. naprapat","worksFor":{"@id":"https://www.kansei.se/#clinic","@type":"MedicalClinic","name":"Kansei Rehabcenter","url":"https://www.kansei.se/"},"alumniOf":[{"@type":"CollegeOrUniversity","name":"Naprapathögskolan"},{"@type":"CollegeOrUniversity","name":"McMaster University"}],"knowsAbout":["Muskuloskeletal ultraljudsdiagnostik","Ortobiologiska injektionsbehandlingar","Neurofunktionell akupunktur","Naprapati","Idrottsmedicin"],"url":"https://www.kansei.se/team/carl-robert-karell/","@id":"https://www.kansei.se/team/carl-robert-karell/#person"}}</script>')
          
          # Sitemap lastmod for materially changed canonical pages.
          p=ROOT/'sitemap.xml'
          s=p.read_text(encoding='utf-8')
          for url in ['https://www.kansei.se/','https://www.kansei.se/kontakt/','https://www.kansei.se/naprapati/','https://www.kansei.se/team/carl-robert-karell/']:
              s=s.replace(f'<loc>{url}</loc><lastmod>2026-08-11</lastmod>', f'<loc>{url}</loc><lastmod>2026-09-09</lastmod>')
          p.write_text(s, encoding='utf-8')
          
          (ROOT/'CHANGELOG-v125.md').write_text('# Kansei v125 — Local SEO & technical cleanup\n\nDate: 2026-09-09\n\n## Changes\n- Strengthened local relevance for **Naprapat + Odenplan + Vasastan + Stockholm** on `/naprapati/`.\n- Changed naprapati H1 to **Naprapat vid Odenplan i Vasastan** and rewrote the opening paragraph for local intent without keyword stuffing.\n- Updated naprapati title, meta description, Open Graph title/description and breadcrumb label.\n- Reworked homepage `MedicalClinic` JSON-LD with stable `@id`, telephone, richer NAP data, area served, service URLs and Person entity references.\n- Removed misleading `PhysicalTherapy` specialty from the clinic schema; physiotherapy remains correctly represented through Magnus Wennerlund where relevant.\n- Corrected `/kontakt/` structured data: it incorrectly identified itself as the Patientinformation page. It is now a `ContactPage` tied to the Kansei clinic entity.\n- Linked Carl-Robert Kårell\'s Person schema to the clinic entity with a stable `@id`.\n- Added **Vasastan** to homepage location copy and meta description.\n- Clarified that the site\'s 301 review count refers to **Bokadirekt**.\n- Removed obsolete `<meta name="keywords">`.\n- Fixed duplicated `<noscript><noscript>` wrappers across templates.\n- Updated sitemap `lastmod` only for materially changed canonical pages.\n\n## Redirect note\nThe existing legacy alias pages remain `noindex` and client-redirect to their canonical destinations. If the production host supports server rules, replace these with HTTP 301 redirects. GitHub Pages alone does not provide arbitrary redirect rules, so no host-specific redirect file was added.\n', encoding='utf-8')
          PYV125
          rm -f .github/workflows/apply-v125.yml
      - name: Commit v125
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'SEO/local search improvements v125'
          git push origin HEAD:main
