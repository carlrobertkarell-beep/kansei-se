name: One-shot full Reda portal presentation refresh
on:
  push:
    branches: [hotfix/reda-portal-full-refresh]
    paths: ['.github/workflows/reda-full-portal-refresh.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/reda-portal-full-refresh
      - name: Replace legacy Reda hero and keep rehab-plan navigation in one tab
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          portal=Path('reda/index.html')
          s=portal.read_text()
          s=s.replace('/assets/reda-portal-shell.css?v=20260916-2','/assets/reda-portal-shell.css?v=20260916-3')
          old=re.compile(r'<div class="reda-lockup">.*?</div>\s*<p class="reda-tag">Din plan från besöket, i mobilen\.</p>',re.S)
          replacement='''<p class="reda-portal-kicker">Din rehabplan</p>\n<h1 class="reda-portal-title">Din plan från besöket.</h1>\n<p class="reda-tag">Ditt program, din dosering och dina nästa steg samlade på ett ställe.</p>'''
          s,n=old.subn(replacement,s,count=1)
          if n != 1: raise SystemExit('Legacy Reda hero not found exactly once')
          portal.write_text(s)

          old_menu='<a href="/reda/" rel="noopener noreferrer" target="_blank">Min rehabplan ↗</a>'
          new_menu='<a href="/reda/">Min rehabplan</a>'
          changed=0
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in p.parts): continue
              text=p.read_text(errors='ignore')
              newer=text.replace(old_menu,new_menu)
              # Redas own public page uses an external-link glyph for an internal same-tab route.
              if p.as_posix()=='reda-rehab/index.html':
                  newer=newer.replace('Mitt program <span aria-hidden="true">↗</span>','Mitt program <span aria-hidden="true">→</span>')
                  newer=newer.replace('Öppna mitt befintliga program <span aria-hidden="true">↗</span>','Öppna mitt befintliga program <span aria-hidden="true">→</span>')
              if newer != text:
                  p.write_text(newer); changed += 1
          if changed < 10: raise SystemExit(f'Expected shared menu change on many pages, got {changed}')
          print('HTML pages changed:',changed)
          PY
      - name: Verify user journeys without changing Reda logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('reda/index.html').read_text()
          for needle in ['class="reda-portal-kicker"','class="reda-portal-title"','id="kodform"','/assets/reda-portal-shell.css?v=20260916-3']:
              assert needle in s, needle
          assert 'class="reda-lockup"' not in s
          assert '/bilder/reda/mark.svg?v=cross-20260910' not in s.split('<main id="huvud">',1)[0]
          bad=[]
          menu_count=0
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in p.parts): continue
              t=p.read_text(errors='ignore')
              if 'Min rehabplan' in t:
                  menu_count += t.count('Min rehabplan')
                  if re.search(r'<a[^>]*href="/reda/"[^>]*target="_blank"[^>]*>Min rehabplan',t): bad.append(str(p))
          assert menu_count >= 10, menu_count
          assert not bad, bad
          public=Path('reda-rehab/index.html').read_text()
          assert 'href="/reda/">Mitt program' in public
          assert 'href="/reda/">Öppna mitt befintliga program' in public
          print('Static journey guard PASS; Min rehabplan occurrences:',menu_count)
          PY
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Unify the Reda code portal and keep rehab-plan navigation in one tab"
          git push origin HEAD:hotfix/reda-portal-full-refresh
