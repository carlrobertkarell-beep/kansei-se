name: One-shot Reda HTML shell patch
on:
  workflow_dispatch:
  push:
    branches: [hotfix/reda-portal-shell-2026-09-16]
    paths: ['.github/workflows/reda-html-shell-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/reda-portal-shell-2026-09-16
      - name: Make Reda portal shell part of first HTML render
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reda/index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/assets/reda-portal-shell.css?v=20260916-2">'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if '<body class="reda-portal-shell">' not in s:
              s=s.replace('<body>', '<body class="reda-portal-shell">', 1)
          top='''<header class="reda-portal-top"><div class="reda-portal-top-inner"><a class="reda-portal-brand" href="/reda-rehab/" aria-label="Reda, produktsida"><img src="/bilder/reda/nav.svg?v=2" width="142" height="54" alt="Reda"><span class="reda-portal-badge">Patientportal</span></a><div class="reda-portal-links" role="navigation" aria-label="Patientportalens länkar"><a href="/reda-rehab/support/">Hjälp &amp; support</a><a class="back-kansei" href="/">Till Kansei</a></div></div></header>'''
          if top not in s:
              marker='<a class="skip" href="#huvud">Till innehållet</a>'
              if marker not in s: raise SystemExit('skip marker missing')
              s=s.replace(marker, top+'\n'+marker, 1)
          foot='''<footer class="reda-portal-footer"><div class="reda-portal-footer-inner"><p><strong>Reda patientportal</strong><br>Kansei Rehabcenter · Upplandsgatan 26 · Odenplan</p><div class="reda-portal-footer-links"><a href="/reda-rehab/">Om Reda</a><a href="/reda-rehab/support/">Support</a><a href="mailto:info@kansei.se">info@kansei.se</a></div></div></footer>'''
          if foot not in s:
              if '</body>' not in s: raise SystemExit('body end missing')
              s=s.replace('</body>', foot+'\n</body>', 1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/reda-portal-shell.css')
          s=p.read_text().replace('body.reda-portal-shell>nav[aria-label="Huvudmeny"],body.reda-portal-shell>footer{display:none!important}', 'body.reda-portal-shell>nav[aria-label="Huvudmeny"],body.reda-portal-shell>footer:not(.reda-portal-footer){display:none!important}')
          p.write_text(s)
          PY
      - name: Verify static shell and unchanged portal hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('reda/index.html').read_text()
          for needle in ['body class="reda-portal-shell"','class="reda-portal-top"','class="reda-portal-footer"','id="kodform"','../config.js']:
              assert needle in s, needle
          assert s.count('class="reda-portal-top"') == 1
          assert s.count('class="reda-portal-footer"') == 1
          PY
      - name: Commit patch to hotfix branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reda/index.html assets/reda-portal-shell.css
          git diff --cached --quiet && exit 0
          git commit -m "Make Reda portal shell static and cache-safe"
          git push origin HEAD:hotfix/reda-portal-shell-2026-09-16
