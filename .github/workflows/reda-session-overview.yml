name: Reda session overview checks
on:
  pull_request:
    paths: ['reda-2/**', '.github/reda2-tests/session-overview.test.mjs', '.github/reda2-tests/session_overview_browser_test.py', '.github/workflows/reda-session-overview.yml']
  push:
    branches: [main]
    paths: ['reda-2/**', '.github/reda2-tests/session-overview.test.mjs', '.github/reda2-tests/session_overview_browser_test.py', '.github/workflows/reda-session-overview.yml']
permissions:
  contents: read
jobs:
  session-overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact-session and round-count rules
        run: |
          node --test .github/reda2-tests/session-overview.test.mjs
          node --check reda-2/patient-live.mjs
          node --check reda-2/session-overview.mjs
      - name: Install browser tester
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install chromium
      - name: Patient overview, pause, completion and retry
        run: python3 .github/reda2-tests/session_overview_browser_test.py
      - name: Retain screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reda-session-overview-${{ github.run_id }}
          path: reda2-test-results/
          retention-days: 3
          if-no-files-found: ignore
