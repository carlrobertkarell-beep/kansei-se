name: Reda 2 prototype checks
on:
  pull_request:
    paths: ['reda-2/**', 'reda-rehab/**', 'config.js', 'sitemap.xml', '.github/reda2-tests/**', '.github/workflows/reda2-tests.yml']
  push:
    branches: [main]
    paths: ['reda-2/**', 'reda-rehab/**', 'config.js', 'sitemap.xml', '.github/reda2-tests/**', '.github/workflows/reda2-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reda2-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise, dosage, clinical model, graph, motion and intelligence unit tests
        run: node --test .github/reda2-tests/core.test.cjs .github/reda2-tests/planner.test.cjs .github/reda2-tests/clinical-model.test.cjs .github/reda2-tests/motion-graph.test.cjs .github/reda2-tests/exercise-intelligence.test.cjs .github/reda2-tests/exercise-quality.test.cjs
      - name: Install browser tester
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 -m playwright install chromium
      - name: Patient and detailed clinician browser flows
        run: python3 .github/reda2-tests/browser_test.py
      - name: Quick prescription browser flows
        run: python3 .github/reda2-tests/browser_fast_test.py
      - name: Clinician workspace and secure sync guardrails
        run: |
          python3 .github/reda2-tests/clinic_v2_test.py
          python3 .github/reda2-tests/secure_live_test.py
          node --check reda-2/secure-browser.mjs
          node --check reda-2/clinic-live.mjs
          node --check reda-2/patient-live.mjs
          node --check reda-2/figures-intelligence.js
      - name: Motion graph and renderer browser flows
        run: python3 .github/reda2-tests/browser_motion_test.py
      - name: Public Reda landing and Kansei homepage integration
        run: python3 .github/reda2-tests/public_landing_test.py
      - name: Existing site regression checks
        run: python3 .github/scripts/check-seo.py
      - name: Retain test screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reda2-tests-${{ github.run_id }}
          path: reda2-test-results/
          retention-days: 3
          if-no-files-found: ignore
