name: SEO regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check HTML, sitemap, JSON-LD and legacy aliases
        run: python3 .github/scripts/check-seo.py
      # Pages' dynamic workflow may not emit workflow_run. Main-branch pushes
      # therefore perform the same read-only smoke test with bounded CDN retries.
      - name: Verify live 404 and legacy redirect responses
        if: github.event_name != 'pull_request'
        run: python3 .github/scripts/check-seo.py --live
