name: One-shot shoulder booking guide cache refresh
on:
  push:
    branches: [hotfix/shoulder-guide-routing]
    paths: ['.github/workflows/shoulder-guide-cache-refresh.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/shoulder-guide-routing
      - name: Point all clinic pages to the new booking guide assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old_area='/assets/areas.52980d1b3316.js'
          new_area='/assets/areas.6f1f8b7e2c11.js'
          old_guide='/assets/guide.4d5c9ea8382f.js'
          new_guide='/assets/guide.9c47a2d1e6b3.js'
          changed=0
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in p.parts):
                  continue
              s=p.read_text(errors='ignore')
              n=s.replace(old_area,new_area).replace(old_guide,new_guide)
              if n != s:
                  p.write_text(n)
                  changed += 1
          if changed < 40:
              raise SystemExit(f'Expected shared booking assets on many pages, changed only {changed}')
          print('HTML pages refreshed:',changed)
          PY
      - name: Static routing guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          area=Path('assets/areas.6f1f8b7e2c11.js').read_text()
          guide=Path('assets/guide.9c47a2d1e6b3.js').read_text()
          assert "lifting:'ultraljud'" in area
          assert "night:'ultraljud'" in area
          assert "stiff:'naprapati'" in area
          assert "rehab:'ultraljud'" in area
          assert "unclear:'naprapati'" in area
          assert 'Axelbedömning' not in guide
          assert 'axelbedomning-av-magnus-wennerlund' not in guide
          assert "['/skuldra/'" not in guide
          html='\n'.join(p.read_text(errors='ignore') for p in Path('.').rglob('*.html') if '.git' not in p.parts)
          assert '/assets/areas.52980d1b3316.js' not in html
          assert '/assets/guide.4d5c9ea8382f.js' not in html
          assert '/assets/areas.6f1f8b7e2c11.js' in html
          assert '/assets/guide.9c47a2d1e6b3.js' in html
          print('Shoulder route static guard PASS')
          PY
      - name: Commit refreshed references
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.html'
          git diff --cached --quiet && exit 0
          git commit -m "Publish cache-safe shoulder booking routes"
          git push origin HEAD:hotfix/shoulder-guide-routing
