name: Visibility delivery validation
on:
  push:
    branches: ['seo/visibility-20261016']
permissions:
  contents: write
concurrency:
  group: visibility-delivery
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'carlrobertkarell-beep/kansei-se' && github.ref == 'refs/heads/seo/visibility-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: seo/visibility-20261016
      - name: Install validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check beautifulsoup4==4.14.3 playwright==1.56.0
          python3 -m playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
      - name: Apply and validate source-preserving update
        run: |
          python3 .github/kansei/visibility-preflight.py
          python3 .github/kansei/visibility-update.py
          node --check assets/analytics.20261016.js
          node --check assets/clinic.20261008.js
          python3 .github/scripts/check-seo.py
          python3 .github/kansei/visibility.py --self-test
          python3 .github/kansei/visibility-browser-test.py
      - name: Save visual checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visibility-validation
          path: /tmp/kansei-visibility-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit validated site changes to the isolated review branch
        run: |
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Apply validated visibility improvements (owner approved)'
            git push origin HEAD:seo/visibility-20261016
          fi
