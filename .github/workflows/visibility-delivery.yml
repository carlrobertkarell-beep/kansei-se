name: Visibility delivery validation
on:
  push:
    branches: ['seo/visibility-20261016']
permissions:
  contents: read
concurrency:
  group: visibility-release-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'carlrobertkarell-beep/kansei-se' && github.ref == 'refs/heads/seo/visibility-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 09e5e34b15a44a36229a975228f0c471729ad79c
          persist-credentials: false
      - name: Recheck released source
        run: |
          python3 .github/scripts/check-seo.py
          python3 .github/kansei/visibility.py --self-test
          node --check assets/analytics.20261016.js
          node --check assets/clinic.20261008.js
      - name: Verify public deployment and notify IndexNow
        run: python3 .github/kansei/verify-visibility-release.py --notify-indexnow --output /tmp/kansei-release/release-verification.json
      - name: Save release verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visibility-release-verification
          path: /tmp/kansei-release/
          if-no-files-found: ignore
          retention-days: 7
