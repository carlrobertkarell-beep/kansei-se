<!DOCTYPE html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hjälp mig boka rätt | Kansei Rehabcenter</title><meta name="description" content="Osäker på vilken tid du ska boka? Välj område och symtommönster så guidar Kansei dig till en rimlig första vårdväg."><link rel="canonical" href="https://www.kansei.se/hjalp-mig-boka/"><link rel="icon" href="/favicon.svg"><style>:root{--p:#F7F9FA;--i:#101820;--d:#5E6B73;--h:rgba(16,24,32,.13);--t:#0D7B6F;--ts:rgba(13,123,111,.09);--s:#F7F3EC}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:system-ui,-apple-system,sans-serif;line-height:1.55}.w{max-width:1080px;margin:auto;padding:0 22px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--h)}a{text-decoration:none;color:inherit}.brand{font-family:Georgia,serif;font-size:1.35rem}.back{font-size:.84rem;color:var(--d)}main{padding:54px 0 90px}.ey{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t);margin-bottom:14px}h1,h2,h3{font-family:Georgia,serif;font-weight:400;line-height:1.05}h1{font-size:clamp(2.7rem,7vw,5.4rem);max-width:820px;margin:0 0 20px}.lead{color:var(--d);font-size:1.08rem;max-width:720px;margin-bottom:34px}.shell{display:grid;grid-template-columns:210px 1fr;gap:28px}.steps{position:sticky;top:20px}.step{padding:12px 0;border-bottom:1px solid var(--h);font-size:.82rem;color:var(--d)}.step.on{color:var(--t)}.panel{background:white;border:1px solid var(--h);border-radius:26px;padding:28px;box-shadow:0 18px 50px rgba(16,24,32,.05)}.panel h2{font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}.helper{color:var(--d);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:1px solid var(--h);background:var(--p);border-radius:18px;padding:18px;text-align:left;font:inherit;cursor:pointer}.choice:hover,.choice:focus{border-color:var(--t);background:var(--ts);outline:none}.choice b{display:block;font-weight:600;margin-bottom:4px}.choice small{color:var(--d)}.hidden{display:none}.summary{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.summary span{background:var(--ts);padding:6px 9px;border-radius:999px;font-size:.76rem}.result-card{background:var(--s);padding:24px;border-radius:20px;margin:20px 0}.result-card h3{font-size:2rem;margin:5px 0 8px}.cta{display:inline-flex;background:var(--t);color:#fff;padding:13px 20px;border-radius:999px;font-weight:600}.secondary{display:inline-flex;margin-left:12px;color:var(--d)}.note{font-size:.78rem;color:var(--d);margin-top:24px;border-top:1px solid var(--h);padding-top:18px}.reset{background:none;border:0;color:var(--t);font:inherit;cursor:pointer}.urgent{background:#fff8f6}.urgent b{color:#812f26}@media(max-width:760px){.shell{grid-template-columns:1fr}.steps{position:static;display:flex;gap:7px;overflow:auto}.step{border:0;white-space:nowrap;background:#fff;border-radius:999px;padding:7px 10px}.panel{padding:20px}.grid{grid-template-columns:1fr}.secondary{display:block;margin:13px 0 0}main{padding-top:38px}}</style></head><body><div class="w"><header class="top"><a class="brand" href="/">Kansei</a><a class="back" href="/">← Startsidan</a></header></div><main><div class="w"><div class="ey">Kansei vägvisare</div><h1>Du behöver inte veta vad du ska boka.</h1><p class="lead">Välj det område som besvärar dig och det mönster som ligger närmast. Vi rekommenderar en första vårdväg, inte en diagnos.</p><div class="shell"><aside class="steps"><div class="step on" data-n="1">01 · Mål</div><div class="step" data-n="2">02 · Område</div><div class="step" data-n="3">03 · Mönster</div><div class="step" data-n="4">04 · Nästa steg</div></aside><section class="panel"><div id="screen"></div></section></div></div></main><script>(function(){const S={goal:null,area:null,pattern:null},book='https://www.bokadirekt.se/places/kansei-rehabcenter-48847';const areas={shoulder:['Nattvärk / svårt ligga på sidan','Stelhet och svårt nå bakom ryggen','Svaghet eller svårt lyfta armen','Smärta vid lyft över axelhöjd','Efter fall eller plötslig skada'],elbow:['Smärta på utsidan','Smärta på insidan','Smärta vid grepp eller lyft','Domning/stickning mot ring- eller lillfinger','Efter överbelastning eller skada'],hand:['Domningar eller stickningar','Smärta vid tumme/handled','Svullnad eller öm sena','Greppsvaghet','Efter fall eller vridning'],hip:['Smärta på utsidan av höften','Ljumsksmärta','Smärta vid gång eller belastning','Stelhet efter vila','Smärta från säte/baksida'],knee:['Svullnad i leden','Smärta i trappor eller uppresning','Smärta vid vridning','Belastningssmärta efter aktivitet','Smärta från sena/framsida knä'],foot:['Hälsenesmärta på morgonen','Smärta under hälen','Fotledssmärta eller instabilitet','Svullnad efter belastning','Efter stukning eller trauma'],back:['Nack-/ryggsmärta utan utstrålning','Utstrålning/domning','Smärta efter belastning','Akut ryggskott/nackspärr','Långvarig stelhet'],other:['Belastningssmärta','Stelhet','Svullnad','Svaghet','Efter skada']};const labels={shoulder:'Axel',elbow:'Armbåge',hand:'Hand/handled',hip:'Höft/ljumske',knee:'Knä',foot:'Fot/fotled',back:'Nacke/rygg',other:'Annat'};const sc=document.getElementById('screen');function step(n){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('on',+x.dataset.n===n))}function goal(){step(1);sc.innerHTML='<h2>Vad vill du ha hjälp med?</h2><p class="helper">Välj det som ligger närmast.</p><div class="grid"><button class="choice" data-g="unknown"><b>Jag har ont</b><small>Jag vet inte riktigt vad det är.</small></button><button class="choice" data-g="ultrasound"><b>Jag vill ha ultraljud</b><small>Riktad MSK-undersökning.</small></button><button class="choice" data-g="injection"><b>Jag funderar på injektion</b><small>PRP/ACP, hyaluron eller axelbedömning.</small></button><button class="choice" data-g="nap"><b>Jag vill boka naprapati</b><small>Undersökning och behandling.</small></button><button class="choice" data-g="return"><b>Jag är redan patient</b><small>Återbesök eller progression.</small></button><button class="choice urgent" data-g="urgent"><b>Det känns akut eller allvarligt</b><small>Stor skada, sjukdomskänsla eller neurologiska symtom.</small></button></div>'}function area(){step(2);sc.innerHTML='<h2>Var sitter huvudbesväret?</h2><p class="helper">Välj det område som är viktigast just nu.</p><div class="grid">'+Object.keys(labels).map(k=>`<button class="choice" data-a="${k}"><b>${labels[k]}</b><small>${k==='back'?'Nacke, bröstrygg eller ländrygg.':'Välj för mer specifika frågor.'}</small></button>`).join('')+'</div>'}function pattern(){step(3);sc.innerHTML='<h2>Vad stämmer bäst?</h2><p class="helper">Frågorna är anpassade efter '+labels[S.area]+'.</p><div class="grid">'+areas[S.area].map((x,i)=>`<button class="choice" data-p="${i}"><b>${x}</b><small>Välj om detta ligger närmast.</small></button>`).join('')+'<button class="choice" data-p="x"><b>Svårt att beskriva</b><small>Jag vill att ni utreder från början.</small></button></div>'}function result(){step(4);let title='Naprapatisk undersökning',reason='En bred klinisk bedömning är en bra start. Vi avgör därefter om ultraljud eller annan utredning tillför något.',learn='/naprapati/',allow=true;if(S.goal==='urgent'){title='Sök annan vårdnivå först';reason='Vid allvarlig akut skada, uttalad sjukdomskänsla eller nytillkommen neurologisk påverkan bör annan vård bedöma dig först.';learn='/patientinformation/';allow=false}else if(S.goal==='ultrasound'){title='Muskuloskeletalt ultraljud';reason='Du söker en riktad bilddiagnostisk bedömning av muskler, senor, leder eller närliggande strukturer.';learn='/ultraljud/'}else if(S.goal==='injection'){title='Injektionskonsultation';reason='Alla injektionsbehandlingar föregås av bedömning av indikation, alternativ och plan.';learn='/injektioner/'}else if(S.goal==='nap'||S.goal==='return'){title='Naprapati / återbesök';reason='Detta är den mest direkta vägen när du redan vet vad du söker.';learn='/naprapati/'}else if(S.area==='back'){title='Naprapatisk undersökning';reason='Ryggens diskar och nervrötter bedöms inte med MSK-ultraljud. Klinisk undersökning är därför rätt första steg.';learn='/naprapati/'}else if(S.area==='shoulder'&&['0','1','2'].includes(String(S.pattern))){title='Axelbedömning med möjlighet till ultraljud';reason='Nattvärk, stelhet och tydlig svaghet är mönster där kombinationen av kliniska tester och riktad ultraljudsbedömning ofta är relevant.';learn='/skuldra/'}else if(['knee','hip','elbow','hand','foot','shoulder'].includes(S.area)){title='Klinisk bedömning med ultraljud vid behov';reason='Vi börjar med funktion och kliniska tester och använder ultraljud när fyndet kan förändra bedömning eller plan.';learn='/ultraljud/'}sc.innerHTML='<div class="ey">Vår rekommendation</div><div class="summary"><span>'+(S.goal||'symtom')+'</span>'+(S.area?'<span>'+labels[S.area]+'</span>':'')+'</div><h2>Vi tycker att du ska börja här.</h2><div class="result-card"><div class="ey">Rimligaste nästa steg</div><h3>'+title+'</h3><p>'+reason+'</p></div>'+(allow?'<a class="cta" href="'+book+'" target="_blank" rel="noopener">Gå vidare till bokning →</a>':'')+'<a class="secondary" href="'+learn+'">Läs mer först</a><p class="note">Guiden ersätter inte medicinsk bedömning. <button class="reset">Börja om</button></p>'}document.addEventListener('click',e=>{let b=e.target.closest('[data-g]');if(b){S.goal=b.dataset.g;if(['ultrasound','injection','nap','return','urgent'].includes(S.goal))result();else area();return}b=e.target.closest('[data-a]');if(b){S.area=b.dataset.a;pattern();return}b=e.target.closest('[data-p]');if(b){S.pattern=b.dataset.p;result();return}if(e.target.closest('.reset')){S.goal=S.area=S.pattern=null;goal()}});goal()})();</script></body></html>
